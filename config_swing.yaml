symbol: BTC/USD
exchange: coinbase
timeframe: 1h
start: '2019-01-01'
end: null

costs:
  taker_fee: 0.0004
  slippage: 0.0002

strategy:
  name: swing
  # Long-biased Donchian breakout with a slow (~40 day) trend filter and ATR
  # trailing stop. Chosen from cross-fold analysis across 2019-2026 regimes
  # (bull/bear/chop), not from the test slice.
  trend_fast: 24
  trend_slow: 960
  vol_window: 168
  entry_window: 168
  exit_atr_mult: 3.0
  trend_min: 0.0
  slope_bars: 0
  cooldown: 72
  allow_short: false
  exit_on_cross: false
  require_breakout: true
  # target_vol scales profit ~linearly; raise with --target-vol for more risk.
  target_vol: 0.80
  max_leverage: 2.0

walk_forward:
  train_days: 120
  step_days: 30
  initial_history_days: 90
